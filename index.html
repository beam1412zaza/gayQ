<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกคิว</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            width:100%;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            overflow:hidden;
            font-family:sans-serif;
            background:linear-gradient(
                135deg,
                #020202,
                #0f0f0f,
                #1a1a1a
            );
            position:relative;
        }

        /* พื้นหลังเรืองแสง */
        body::before{
            content:"";
            position:absolute;
            width:600px;
            height:600px;
            background:#00ffcc;
            filter:blur(200px);
            opacity:0.15;
            animation: moveGlow 6s infinite alternate;
        }

        @keyframes moveGlow{
            from{
                transform:translate(-100px,-50px);
            }

            to{
                transform:translate(100px,50px);
            }
        }

        h1{
            position:relative;
            z-index:2;

            font-size:120px;
            text-align:center;
            line-height:1.3;

            color:#00ffcc;

            text-shadow:
                0 0 10px #00ffcc,
                0 0 20px #00ffcc,
                0 0 40px #00ffcc,
                0 0 80px #00ffcc,
                0 0 120px #00ffcc;

            animation: glow 2s infinite alternate;
        }

        @keyframes glow{
            from{
                transform:scale(1);
                opacity:0.85;
            }

            to{
                transform:scale(1.08);
                opacity:1;
            }
        }

        /* ดาวพื้นหลัง */
        .star{
            position:absolute;
            width:3px;
            height:3px;
            background:white;
            border-radius:50%;
            animation: blink 2s infinite alternate;
        }

        @keyframes blink{
            from{
                opacity:0.2;
            }

            to{
                opacity:1;
            }
        }

        @media(max-width:768px){
            h1{
                font-size:60px;
            }
        }
    </style>
</head>
<body>

    <!-- ดาว -->
    <div class="star" style="top:10%; left:20%;"></div>
    <div class="star" style="top:30%; left:70%;"></div>
    <div class="star" style="top:50%; left:40%;"></div>
    <div class="star" style="top:80%; left:60%;"></div>
    <div class="star" style="top:20%; left:90%;"></div>
    <div class="star" style="top:70%; left:10%;"></div>

    <h1>
        เกคิว<br>
        แต่งงานกับ<br>
        เกโบจ<br>
        และ<br>
        เกวสัน
    </h1>

</body>
</html>
