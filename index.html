<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกคิว</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            width:100%;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#050505,#111,#1a1a1a);
            overflow:hidden;
            font-family:sans-serif;
        }

        h1{
            font-size:120px;
            text-align:center;
            line-height:1.3;
            color:#00ffcc;

            text-shadow:
                0 0 10px #00ffcc,
                0 0 20px #00ffcc,
                0 0 40px #00ffcc,
                0 0 80px #00ffcc;

            animation: glow 2s infinite alternate;
        }

        @keyframes glow{
            from{
                transform:scale(1);
                opacity:0.8;
            }

            to{
                transform:scale(1.08);
                opacity:1;
            }
        }

        @media(max-width:768px){
            h1{
                font-size:60px;
            }
        }
    </style>
</head>
<body>

    <h1>
        เกคิว<br>
        แต่งงานกับ<br>
        เกโบจ
    </h1>

</body>
</html>
