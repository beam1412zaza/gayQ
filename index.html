<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกคิว</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            width:100%;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            overflow:hidden;
            font-family:sans-serif;
            background:linear-gradient(
                135deg,
                #020202,
                #0f0f0f,
                #1a1a1a
            );
            position:relative;
        }

        /* พื้นหลังเรืองแสง */
        body::before{
            content:"";
            position:absolute;
            width:600px;
            height:600px;
            background:#00ffcc;
            filter:blur(200px);
            opacity:0.15;
            animation: moveGlow 6s infinite alternate;
        }

        @keyframes moveGlow{
            from{
                transform:translate(-100px,-50px);
            }

            to{
                transform:translate(100px,50px);
            }
        }

        h1{
            position:relative;
            z-index:2;
            pointer-events:none;

            font-size:120px;
            text-align:center;
            line-height:1.3;

            color:#00ffcc;

            text-shadow:
                0 0 10px #00ffcc,
                0 0 20px #00ffcc,
                0 0 40px #00ffcc,
                0 0 80px #00ffcc,
                0 0 120px #00ffcc;

            animation: glow 2s infinite alternate;
        }

        @keyframes glow{
            from{
                transform:scale(1);
                opacity:0.85;
            }

            to{
                transform:scale(1.08);
                opacity:1;
            }
        }

        /* ดาวพื้นหลัง */
        .star{
            position:absolute;
            width:3px;
            height:3px;
            background:white;
            border-radius:50%;
            animation: blink 2s infinite alternate;
        }

        @keyframes blink{
            from{
                opacity:0.2;
            }

            to{
                opacity:1;
            }
        }

        @media(max-width:768px){
            h1{
                font-size:60px;
            }
        }

        #heart-counter{
            position:absolute;
            top:20px;
            right:20px;
            z-index:3;
            color:#ff7fa7;
            font-size:22px;
            font-weight:700;
            text-shadow:0 0 12px rgba(255,127,167,0.85);
            padding:12px 18px;
            border:1px solid rgba(255,127,167,0.4);
            border-radius:999px;
            background:rgba(0,0,0,0.35);
            backdrop-filter:blur(10px);
        }

        .heart-floating{
            position:absolute;
            pointer-events:auto;
            z-index:4;
            font-size:2rem;
            animation: floatUp linear forwards;
            text-shadow:0 0 12px rgba(255, 75, 130, 0.9);
            transform-origin:center;
            cursor:pointer;
            user-select:none;
        }

        .heart-floating:hover{
            transform:scale(1.2);
        }

        .heart-floating.collected{
            animation:none;
            transition:transform 0.2s ease, opacity 0.2s ease;
            transform:scale(1.4);
            opacity:0;
        }

        @keyframes floatUp{
            0%{
                transform:translateY(0) scale(1);
                opacity:0;
            }
            20%{
                opacity:1;
            }
            100%{
                transform:translateY(-120vh) scale(0.8);
                opacity:0;
            }
        }
    </style>
</head>
<body>

    <!-- ดาว -->
    <div class="star" style="top:10%; left:20%;"></div>
    <div class="star" style="top:30%; left:70%;"></div>
    <div class="star" style="top:50%; left:40%;"></div>
    <div class="star" style="top:80%; left:60%;"></div>
    <div class="star" style="top:20%; left:90%;"></div>
    <div class="star" style="top:70%; left:10%;"></div>

    <div id="heart-counter">แตะหัวใจได้ 0</div>

    <h1>
        เกคิว<br>
        แต่งงานกับ<br>
        เกโบจ<br>
        และ<br>
        เกวสัน
    </h1>

    <script>
        const body = document.body;
        const counterEl = document.getElementById('heart-counter');
        let heartCount = 0;

        function updateCounter(){
            counterEl.textContent = `แตะหัวใจได้ ${heartCount}`;
        }

        function createHeart(){
            const heart = document.createElement('div');
            heart.className = 'heart-floating';
            heart.textContent = '❤️';
            const size = Math.round(24 + Math.random() * 20);
            heart.style.fontSize = `${size}px`;
            heart.style.left = `${Math.random() * 80 + 10}%`;
            heart.style.bottom = '-5%';
            heart.style.animationDuration = `${6 + Math.random() * 4}s`;
            heart.style.opacity = '0';

            heart.addEventListener('click', event => {
                event.stopPropagation();
                if (heart.classList.contains('collected')) return;
                heartCount += 1;
                updateCounter();
                heart.classList.add('collected');
                setTimeout(() => heart.remove(), 200);
            });

            body.appendChild(heart);
            const lifetime = parseFloat(heart.style.animationDuration) * 1000;
            setTimeout(() => {
                if (body.contains(heart)) heart.remove();
            }, lifetime + 400);
        }

        updateCounter();
        createHeart();
        createHeart();
        setInterval(createHeart, 900);
    </script>
</body>
</html>
