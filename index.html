<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกคิว</title>

    <style>
        body{
            margin:0;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:#111;
            overflow:hidden;
            font-family:sans-serif;
        }

        h1{
            font-size:120px;
            color:#00ffcc;
            text-shadow:
                0 0 10px #00ffcc,
                0 0 20px #00ffcc,
                0 0 40px #00ffcc;
            animation: glow 2s infinite alternate;
        }
        

        @keyframes glow{
            from{
                transform:scale(1);
            }
            to{
                transform:scale(1.08);
            }
        }
    </style>
</head>
<body>

    <h1>เกคิว</h1><br><h1>แต่งงานกับ</h1><br><h1>เกโบจ</h1>

</body>
</html>
